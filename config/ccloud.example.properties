# Confluent Cloud Kafka client properties for the orchestrator's kafka mode.
# Copy to ccloud.properties (gitignored) and fill in your API key + secret.
#
# The API key must have:
#   - read access to the subscription topic (kf-sub-test)
#   - write access to the ACK topic (kf-ack-test)
#
# Create a key via:
#   confluent api-key create --resource lkc-6w3rv2 --description "orchestrator kafka mode"

bootstrap.servers=pkc-7xoy1.eu-central-1.aws.confluent.cloud:9092
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='<API_KEY>' password='<API_SECRET>';
